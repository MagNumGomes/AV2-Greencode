services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode_dev
      POSTGRES_DB: greencode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - greencode_av2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  greencode_av2:
